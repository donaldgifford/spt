{{- if and .Values.secrets.create .Values.secrets.stringData -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "spt.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spt.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.stringData }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
